---
name: coverage
on:
  push:
    branches: ['main']
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - 'scripts/abs-testenv.sh'
      - '.github/workflows/coverage.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the badge is pushed to a branch, so only a run on main may write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # publish-coverage-badge.sh needs the remote refs to find or create
          # the orphan branch
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq docker

      # unit tests alone report ~40% for tools/, because almost everything real
      # happens in the live suites: make cover runs all three and merges them
      - name: Run every suite with coverage
        run: make cover

      - name: Summarise
        id: cov
        run: |
          pct=$(go tool cover -func=.coverage/coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"
          {
            echo "## coverage: ${pct}%"
            echo
            echo '```'
            go tool covdata percent -i=.coverage/unit,.coverage/integration,.coverage/acceptance
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.cov.outputs.pct }}
        run: bash ./scripts/publish-coverage-badge.sh

      - name: Tear down
        if: always()
        run: |
          ABS_TEST_CONTAINER=abs-mcp-sdk scripts/abs-testenv.sh down || true
          scripts/abs-testenv.sh down || true
