---
name: live tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - 'scripts/abs-testenv.sh'
      - 'acceptance/**'
      - 'integration/**'
      - 'lib/providerproxy/**'
      - '.github/workflows/pr-integration.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the two suites are separate jobs so a failure names which layer broke:
  # the client's view of the API, or the tools' behaviour on top of it
  integration:
    name: integration (lib/abs against a real server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      # ffmpeg generates the fixture audio and jq parses the seeding
      # responses. ffmpeg is not on the runner image, so install it rather
      # than assume it is there.
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq docker

      # make owns the container lifecycle, so CI runs exactly what a
      # developer runs rather than a second copy of the same steps
      - name: Run the SDK suite
        run: make testacc-integration

      - name: Tear down
        if: always()
        run: |
          ABS_TEST_CONTAINER=abs-mcp-sdk scripts/abs-testenv.sh down || true

  acceptance:
    name: acceptance (tools against a real server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq docker

      # provider calls replay from the committed cassettes, so this needs no
      # network beyond the container image
      - name: Run the tool suite
        run: make testacc-acceptance

      - name: Tear down
        if: always()
        run: scripts/abs-testenv.sh down || true
